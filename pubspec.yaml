name: country_icons
description: A flutter package with many country flag icons that you can use via the Image.asset method
version: 2.0.2
homepage: https://github.com/bytepark/country_icons

environment:
  sdk: ^3.10.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_svg: 2.3.0
  flutter_test:
    sdk: flutter

# The following section is specific to Flutter.
flutter:
  assets:
    - icons/flags/png/
    - icons/flags/png/2.5x/
    - icons/flags/svg/
